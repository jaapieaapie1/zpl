[package]
name = "pdf-renderer"
version.workspace = true
edition.workspace = true

[dependencies]
zpl-state-manager = { path = "../zpl-state-manager" }
zpl-parser = { path = "../zpl-parser" }
zpl-symbols = { path = "../zpl-symbols" }
png-renderer = { path = "../png-renderer" }
pdf-writer = "0.15"
ttf-parser = "0.25"
# Private repository: fetched over SSH (see .cargo/config.toml and the Dockerfile).
qr-encode = { git = "ssh://git@github.com/jaapieaapie1/qrcode.git", rev = "766b33a5c6d8d70ab03e5a5f81bd2ffedf8da083", default-features = false }
qr-core = { git = "ssh://git@github.com/jaapieaapie1/qrcode.git", rev = "766b33a5c6d8d70ab03e5a5f81bd2ffedf8da083", default-features = false }
miniz_oxide = "0.8"
subsetter = { version = "0.2", default-features = false }
# ^PA advanced text layout: OpenType shaping and Unicode bidi.
rustybuzz = "0.20.1"
unicode-bidi = "0.3.18"
unicode-script = "0.5.8"
unicode-bidi-mirroring = "0.4.0"

[[bench]]
name = "render"
harness = false

[dev-dependencies]
libc = "0.2"
