[package]
name = "zpl-wasm"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
zpl-parser = { path = "../zpl-parser", features = ["source-map"] }
zpl-state-manager = { path = "../zpl-state-manager", features = ["source-map"] }
png-renderer = { path = "../png-renderer", features = ["source-map"] }
pdf-renderer = { path = "../pdf-renderer" }
wasm-bindgen = "0.2"
