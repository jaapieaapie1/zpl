[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "caretly"
dynamic = ["version"]
description = "Client for the Caretly API: render ZPL labels to PDF or PNG."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jaap Elst", email = "jaapelst@gmail.com" }]
keywords = ["zpl", "zebra", "label", "barcode", "pdf", "png", "printing", "caretly", "api-client"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: AsyncIO",
    "Topic :: Printing",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.25,<1"]

[project.urls]
Homepage = "https://caretly.dev"
Repository = "https://github.com/jaapieaapie1/zpl"
Issues = "https://github.com/jaapieaapie1/zpl/issues"
Changelog = "https://github.com/jaapieaapie1/zpl/blob/main/clients/python/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "anyio>=4",
    "mypy>=1.10",
    "ruff>=0.6",
    "build>=1.2",
    "twine>=6.1",
]

[tool.hatch.version]
path = "src/caretly/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/caretly"]

[tool.hatch.build.targets.sdist]
include = ["src/caretly", "tests", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
strict = true

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF", "SIM", "PT"]
ignore = ["UP006", "UP007", "UP035", "UP045", "A002"]

[tool.ruff.lint.per-file-ignores]
"src/caretly/_types.py" = ["UP037"]
